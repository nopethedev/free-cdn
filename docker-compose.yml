services:
  cascade:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CASCADE_DATA_DIR: /data
      CASCADE_ADMIN_EMAIL: ${CASCADE_ADMIN_EMAIL:-}
      CASCADE_ADMIN_PASSWORD: ${CASCADE_ADMIN_PASSWORD:-}
      CASCADE_TRUST_PROXY: ${CASCADE_TRUST_PROXY:-0}
      CASCADE_COOKIE_SECURE: ${CASCADE_COOKIE_SECURE:-0}
      CASCADE_BROWSER_LOGIN: ${CASCADE_BROWSER_LOGIN:-0}
      CASCADE_BROWSER_LOGIN_TIMEOUT: ${CASCADE_BROWSER_LOGIN_TIMEOUT:-600}
      CASCADE_PUBLIC_BASE_URL: ${CASCADE_PUBLIC_BASE_URL:-}
      CASCADE_DROPBOX_CLIENT_ID: ${CASCADE_DROPBOX_CLIENT_ID:-}
      CASCADE_DROPBOX_CLIENT_SECRET: ${CASCADE_DROPBOX_CLIENT_SECRET:-}
      CASCADE_GOOGLE_CLIENT_ID: ${CASCADE_GOOGLE_CLIENT_ID:-}
      CASCADE_GOOGLE_CLIENT_SECRET: ${CASCADE_GOOGLE_CLIENT_SECRET:-}
      CASCADE_MICROSOFT_CLIENT_ID: ${CASCADE_MICROSOFT_CLIENT_ID:-}
      CASCADE_MICROSOFT_CLIENT_SECRET: ${CASCADE_MICROSOFT_CLIENT_SECRET:-}
    volumes:
      - cascade-data:/data

volumes:
  cascade-data:
