services:
  cascade:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CASCADE_DATA_DIR: /data
      CASCADE_ADMIN_EMAIL: ${CASCADE_ADMIN_EMAIL:-admin@example.com}
      CASCADE_ADMIN_PASSWORD: ${CASCADE_ADMIN_PASSWORD:-change-me-please}
      CASCADE_TRUST_PROXY: ${CASCADE_TRUST_PROXY:-0}
      CASCADE_COOKIE_SECURE: ${CASCADE_COOKIE_SECURE:-0}
    volumes:
      - cascade-data:/data

volumes:
  cascade-data:
