{% extends "layout_public.html" %}
{% block title %}Sign in · {{ site_name }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Welcome back</span>
    <h1>Sign in</h1>
    <p class="muted">Use the account created for you by an administrator.</p>
    {% if error %}<div class="alert alert-bad">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="form-stack">
      <input type="hidden" name="next" value="{{ next_url }}">
      <label class="field">
        <span>Email</span>
        <input class="input" type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
    <p class="auth-foot">No account? <a href="/signup">Create one</a></p>
  </div>
</div>
{% endblock %}
